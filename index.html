<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beacon - Power Outage Tracker</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#FFE033">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap">
</head>
<body x-data="beaconApp" x-init="init()">
  <nav class="desktop-nav">
    <div class="user-profile">
      <div class="user-avatar" x-text="userInitials"></div>
      <div class="user-info">
        <h3 x-text="userName">Guest</h3>
        <p x-text="userRole">Public</p>
      </div>
    </div>

    <ul class="desktop-nav-menu">
      <li class="desktop-nav-item active" data-page="dashboard">
          <span class="material-symbols-outlined desktop-nav-icon">dashboard</span>
          <span>Dashboard</span>
      </li>
      <li class="desktop-nav-item" data-page="calendar">
        <a href="calendar.html" class="desktop-nav-link">
          <span class="material-symbols-outlined desktop-nav-icon">calendar_month</span>
          <span>Calendar</span>
        </a>
      </li>
      <li class="desktop-nav-item" data-page="report">
        <a href="report.html" class="desktop-nav-link">
          <span class="material-symbols-outlined desktop-nav-icon">report</span>
          <span>Report</span>
        </a>
      </li>
      <li class="desktop-nav-item" data-page="map">
        <a href="map.html" class="desktop-nav-link">
          <span class="material-symbols-outlined desktop-nav-icon">map</span>
          <span>Map</span>
        </a>
      </li>
      <li class="desktop-nav-item" data-page="notification">
        <a href="notification.html" class="desktop-nav-link">
          <span class="material-symbols-outlined desktop-nav-icon">notifications</span>
          <span>Notifications</span>
        </a>
      </li>
    </ul>
  </nav>

  <div class="content-area">
    <header>
      <div class="logo">Beacon</div>
      <div class="profile-icon" x-text="userInitials"></div>
    </header>

    <main class="page active" id="dashboard">
      <div class="search-container">
        <span class="material-symbols-outlined search-icon">search</span>
        <input type="text" x-model="searchTerm" class="search-input" placeholder="Search outages, feeder, area...">
      </div>

      <div class="filter-container">
        <input type="date" x-model="dateFilter" class="filter-select">
        <select x-model="statusFilter" class="filter-select">
          <option value="" disabled selected>Select Status</option>
          <option>All Status</option>
          <option>Reported</option>
          <option>Ongoing</option>
          <option>Completed</option>
        </select>
      </div>

      <h2 class="section-title">Recent Outages</h2>
      <div class="reports-grid" id="reports-container">
        <template x-for="item in processedAnnouncements" :key="item.id">
          <div class="announcement-card" @click="openDetails(item)">
            <div class="card-header">
              <div>
                <h3 x-text="`${item.cause || 'Outage'} at ${item.location}`"></h3>
                <p x-text="formatDate(item.created_at)"></p>
              </div>
              <template x-if="isUserArea(item)">
                <span class="badge-area">Your Area</span>
              </template>
            </div>
            
            <div class="card-details-grid">
              <div><small>Feeder</small><b x-text="item.feeders?.name || 'N/A'"></b></div>
              <div><small>Status</small>
                <span :class="'status-pill status-' + (item.status || 'unknown').toLowerCase()" x-text="item.status"></span>
              </div>
            </div>

            <template x-if="item.announcement_images?.[0]">
              <img :src="item.announcement_images[0].image_url" class="card-img">
            </template>
          </div>
        </template>
      </div>
    </main>
  </div>

  <template x-if="selectedItem">
    <div class="report-modal" @click.self="selectedItem = null" x-transition>
      <div class="modal-content">
        <button class="modal-close" @click="selectedItem = null">✕</button>
        <img x-show="selectedItem.announcement_images?.[0]" :src="selectedItem.announcement_images?.[0]?.image_url">
        <div class="modal-body">
          <h2 x-text="selectedItem.cause"></h2>
          <p x-text="selectedItem.description"></p>
          <button x-show="selectedItem.latitude" @click="goToMap(selectedItem)" class="btn-map">View on Map</button>
        </div>
      </div>
    </div>
  </template>

  <nav class="bottom-nav">
    <a class="nav-item active" data-page="dashboard">
      <span class="material-symbols-outlined nav-icon">dashboard</span>
      <span>Dashboard</span>
    </a>
    <a href="calendar.html" class="nav-item" data-page="calendar">
      <span class="material-symbols-outlined nav-icon">calendar_month</span>
      <span>Calendar</span>
    </a>
    <a href="report.html" class="nav-item" data-page="report">
      <span class="material-symbols-outlined nav-icon">report</span>
      <span>Report</span>
    </a>
    <a href="map.html" class="nav-item" data-page="map">
      <span class="material-symbols-outlined nav-icon">map</span>
      <span>Map</span>
    </a>
    <a href="notification.html" class="nav-item" data-page="notification">
      <span class="material-symbols-outlined nav-icon">notifications</span>
      <span>Notifications</span>
    </a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
  <script src="script/global.js"></script>
  <script src="script/dashboard.js"></script>
</body>
</html>
