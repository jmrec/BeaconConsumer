<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beacon - Power Outage Tracker</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#FFE033" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"
    />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script/global.js"></script>
    <script src="script/dashboard.js"></script>
    <script src="script/report.js"></script>
    <script src="script/calendar.js"></script>
    <script src="script/map.js"></script> </head>
    <script src="script/notification.js"></script>
  </head>

  <body x-data="mainShell" x-init="init()" x-cloak>
    <nav class="desktop-nav">
      <div class="user-profile">
        <div class="user-avatar">
          <template x-if="$store.auth.user?.avatar">
            <img
              :src="$store.auth.user.avatar"
              style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover"
            />
          </template>
          <template x-else>
            <span x-text="$store.auth.user?.initials || '?'"></span>
          </template>
        </div>
        <div class="user-info">
          <h3
            x-text="$store.auth.user ? ($store.auth.user.firstName + ' ' + $store.auth.user.lastName) : 'Guest User'"
          ></h3>
          <p x-text="$store.auth.isGuest ? 'Guest' : 'User'"></p>
        </div>
      </div>

      <ul class="desktop-nav-menu">
        <template x-for="item in navItems" :key="item.id">
          <li>
            <a
              class="desktop-nav-item"
              :class="{ 'active': currentPage === item.id }"
              @click="navigateTo(item.id)"
            >
              <span class="material-symbols-outlined desktop-nav-icon" x-text="item.icon"></span>
              <span x-text="item.label"></span>
            </a>
          </li>
        </template>
      </ul>
    </nav>

    <div class="content-area">
      <header>
        <div class="logo">Beacon</div>
        <div
          class="profile-icon"
          @click="toggleProfileMenu($event)"
          style="cursor: pointer; overflow: hidden"
        >
          <template x-if="$store.auth.user?.avatar">
            <img
              :src="$store.auth.user.avatar"
              alt="Profile"
              style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover"
            />
          </template>
          <template x-if="!$store.auth.user?.avatar">
            <span x-text="$store.auth.user?.initials || '?'"></span>
          </template>
        </div>
      </header>

      <div id="page-view" x-html="viewHtml"></div>
    </div>

    <nav class="bottom-nav">
      <template x-for="item in navItems" :key="item.id">
        <a
          class="nav-item"
          :class="{ 'active': currentPage === item.id }"
          @click="navigateTo(item.id)"
        >
          <span class="material-symbols-outlined nav-icon" x-text="item.icon"></span>
          <span x-text="item.label"></span>
        </a>
      </template>
    </nav>

    <div x-show="loadingPage" class="page-loader">
      <div class="spinner"></div>
    </div>
  </body>
</html>
