<main x-data="reportApp" x-init="init()" class="page active">
  <div x-show="initialized" x-cloak>
    <section x-show="!isFormOpen" x-transition>
      <div class="report-action-card" @click="openForm()">
        <div class="report-action-content">
          <span class="material-symbols-outlined report-action-icon">add_circle</span>
          <h3>+ Report Outage</h3>
        </div>
      </div>

      <h2 class="section-title">Previous Reports</h2>
      <div class="reports-grid">
        <template x-for="report in reports" :key="report.id">
          <div class="report-card" @click="openReportDetails(report)">
            <div class="status-highlight" :class="'status-' + (report.status || 'pending')"></div>
            <div class="report-header">
              <div class="feeder-info" x-text="report.barangays?.name || 'N/A'"></div>
              <div class="status-container">
                <div
                  class="status"
                  :class="'status-' + (report.status || 'pending')"
                  x-text="report.status || 'Pending'"
                ></div>
                <button class="three-dots-btn" @click.stop="deleteReport(report.id)">
                  <span class="material-symbols-outlined">delete</span>
                </button>
              </div>
            </div>
            <div
              class="report-date"
              x-text="'Reported: ' + formatDateTime(report.outage_time)"
            ></div>
            <div class="report-description" x-text="report.description"></div>
          </div>
        </template>
      </div>
    </section>

    <section x-show="isFormOpen" x-transition>
      <div class="report-form">
        <div style="display: flex; justify-content: space-between; align-items: center">
          <h2 class="section-title">Report Outage</h2>
          <button
            @click="closeForm()"
            class="modal-close-btn"
            style="background: none; border: none; font-size: 24px; cursor: pointer"
          >
            ✕
          </button>
        </div>

        <div class="form-group">
          <label class="form-label required">Barangay</label>
          <select class="form-select" x-model="form.barangay_id">
            <option value="">Select Barangay</option>
            <template x-for="b in barangayList" :key="b.id">
              <option :value="b.id" x-text="b.name"></option>
            </template>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label required">Cause</label>
          <div class="toggle-buttons">
            <template x-for="c in causes">
              <button
                type="button"
                class="toggle-button"
                :class="form.cause === c ? 'active' : ''"
                @click="form.cause = c"
                x-text="c"
              ></button>
            </template>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label required">Description</label>
          <textarea
            class="form-textarea"
            x-model="form.description"
            placeholder="Minimum 10 characters..."
          ></textarea>
        </div>

        <button class="submit-button" @click="submitReport()" :disabled="submitting">
          <span x-show="submitting" class="spinner"></span>
          <span x-text="submitting ? 'Analyzing & Sending...' : 'Submit Report'"></span>
        </button>
      </div>
    </section>
  </div>

  <template x-if="selectedReport">
    <div class="report-modal" @click.self="selectedReport = null" x-transition>
      <div
        class="modal-content"
        style="
          background: #fff;
          width: 100%;
          max-width: 600px;
          border-radius: 16px;
          overflow: hidden;
          position: relative;
          padding: 20px;
        "
      >
        <button
          class="modal-close"
          @click="selectedReport = null"
          style="position: absolute; top: 15px; right: 15px"
        >
          ✕
        </button>
        <h2 x-text="selectedReport.cause"></h2>
        <p x-text="selectedReport.description"></p>
      </div>
    </div>
  </template>

  <div x-show="!initialized" style="text-align: center; padding: 50px">
    <p>Initializing reports...</p>
  </div>
</main>
