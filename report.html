<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report - Beacon</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#FFE033">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap">
</head>
<body x-data="reportApp" x-init="init()" x-cloak>
    <nav class="desktop-nav">
        <div class="user-profile">
            <div class="user-avatar" x-text="userInitials"></div>
            <div class="user-info">
                <h3 x-text="userName">Guest</h3>
                <p x-text="userRole">User</p>
            </div>
        </div>
        <ul class="desktop-nav-menu">
            <template x-for="item in navItems" :key="item.id">
                <li>
                    <a class="desktop-nav-item" :class="{ 'active': window.location.pathname.includes(item.url) || (item.url === 'index.html' && window.location.pathname === '/') }" :href="item.url" @click="showPage(item.id)">
                        <span class="material-symbols-outlined desktop-nav-icon" x-text="item.icon"></span>
                        <span x-text="item.label"></span>
                    </a>
                </li>
            </template>
        </ul>
    </nav>

    <div class="content-area">
        <header>
            <div class="logo">Beacon</div>
            <div class="profile-icon" x-text="userInitials"></div>
        </header>

        <main class="page" x-show="!isFormOpen" x-transition>
            <div class="report-action-card" @click="openForm()">
                <div class="report-action-content">
                    <span class="material-symbols-outlined report-action-icon">add_circle</span>
                    <h3>+ Report Outage</h3>
                </div>
            </div>

            <h2 class="section-title">Previous Reports</h2>
            <div class="reports-grid">
                <template x-for="report in reports" :key="report.id">
                    <div class="report-card" @click="showDetails(report)">
                        <div class="status-highlight" :class="'status-' + report.status"></div>
                        <div class="report-header">
                            <div class="feeder-info" x-text="report.barangays?.name || 'N/A'"></div>
                            <div class="status-container">
                                <div class="status" :class="'status-' + report.status" x-text="report.status"></div>
                                <button class="three-dots-btn" @click.stop="deleteReport(report.id)">
                                    <span class="material-symbols-outlined">delete</span>
                                </button>
                            </div>
                        </div>
                        <div class="report-date" x-text="'Reported: ' + formatDateTime(report.outage_time)"></div>
                        <div class="report-description" x-text="report.description"></div>
                    </div>
                </template>
            </div>
        </main>

        <main class="page" x-show="isFormOpen" x-transition>
            <div class="report-form">
                <div style="display:flex; justify-content: space-between;">
                    <h2 class="section-title">Report Outage</h2>
                    <button @click="closeForm()" class="modal-close-btn">✕</button>
                </div>
                
                <div class="form-group">
                    <label class="form-label required">Barangay</label>
                    <select class="form-select" x-model="form.barangay_id">
                        <option value="">Select Barangay</option>
                        <template x-for="b in barangayList" :key="b.id">
                            <option :value="b.id" x-text="b.name"></option>
                        </template>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label required">Cause</label>
                    <div class="toggle-buttons">
                        <template x-for="c in causes">
                            <button class="toggle-button" :class="form.cause === c ? 'active' : ''" @click="form.cause = c" x-text="c"></button>
                        </template>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label required">Description</label>
                    <textarea class="form-textarea" x-model="form.description" placeholder="Minimum 10 characters..."></textarea>
                </div>

                <div class="form-group">
                    <label class="form-label">Upload Images (Max 5)</label>
                    <div class="file-upload" @click="$refs.fileInput.click()">
                        <span class="material-symbols-outlined">upload</span>
                        <p x-text="uploadedImages.length > 0 ? uploadedImages.length + ' files ready' : 'Tap to take photo'"></p>
                    </div>
                    <input type="file" x-ref="fileInput" @change="handleImageSelection($event)" multiple accept="image/*" style="display:none">
                    
                    <div class="image-preview-container">
                        <template x-for="(img, index) in imagePreviews" :key="index">
                            <div class="preview-item">
                                <img :src="img" class="preview-thumb">
                                <button @click="removeImage(index)" class="remove-x">×</button>
                            </div>
                        </template>
                    </div>
                </div>

                <button class="submit-button" @click="submitReport()" :disabled="submitting">
                    <span x-show="submitting" class="spinner"></span>
                    <span x-text="submitting ? 'Analyzing & Sending...' : 'Submit Report'"></span>
                </button>
            </div>
        </main>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><span class="material-symbols-outlined">dashboard</span><span>Dashboard</span></a>
        <a class="nav-item active"><span class="material-symbols-outlined">report</span><span>Report</span></a>
        <a href="map.html" class="nav-item"><span class="material-symbols-outlined">map</span><span>Map</span></a>
    </nav>
</body>
</html>
