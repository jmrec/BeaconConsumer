<main x-data="notificationApp" x-init="init()" class="page active">
  <div x-cloak>
    <template x-if="!$store.auth.user">
      <div style="padding: 40px; text-align: center; color: #666">
        <span
          class="material-symbols-outlined"
          style="font-size: 3rem; color: #ccc; margin-bottom: 10px"
          >lock</span
        >
        <p>Please log in to view notifications.</p>
        <button
          @click="window.location.href='login.html'"
          style="
            margin-top: 15px;
            padding: 10px 20px;
            background: #f1c40f;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
          "
        >
          Login Now
        </button>
      </div>
    </template>

    <template x-if="$store.auth.user">
      <section>
        <div class="notif-page-header">
          <h2 style="margin: 0; font-size: 1.1rem; color: #333">Notifications</h2>
          <div class="notif-actions">
            <button @click="markAllAsRead()" class="text-btn">Mark all as read</button>
            <button @click="showSettings = true" class="icon-btn">
              <span class="material-symbols-outlined">settings</span>
            </button>
          </div>
        </div>

        <div class="notif-list">
          <template x-if="filteredNotifications.length === 0">
            <div class="empty-state">
              <span class="material-symbols-outlined">notifications_off</span>
              <p>No notifications</p>
              <p class="empty-state-detail">You're all caught up!</p>
            </div>
          </template>

          <template x-for="n in filteredNotifications" :key="n.id">
            <div
              :class="['notification-card', n.isRead ? 'read' : 'unread', n.isUrgent ? 'urgent' : '']"
              @click="routeToDashboard(n)"
            >
              <div class="notification-icon">
                <span
                  class="material-symbols-outlined"
                  x-text="n.isUrgent ? 'event' : 'bolt'"
                ></span>
              </div>
              <div class="notification-content">
                <div class="notification-header">
                  <span class="notification-title" x-text="n.title"></span>
                  <template x-if="n.isUrgent">
                    <span class="badge-urgent">UPCOMING</span>
                  </template>
                </div>
                <div class="notification-detail" x-text="n.message"></div>
                <div class="notification-time" x-text="formatTime(n.timestamp)"></div>
              </div>
              <template x-if="!n.isRead">
                <div class="unread-dot"></div>
              </template>
            </div>
          </template>
        </div>
      </section>
    </template>
  </div>

  <template x-if="showSettings">
    <div class="modal-overlay active" style="z-index: 20001" @click.self="showSettings = false">
      <div class="settings-popover">
        <div class="settings-header">
          <span>Notification Settings</span>
          <button @click="showSettings = false">×</button>
        </div>
        <div class="settings-body">
          <div class="setting-row">
            <div>
              <label>Scheduled Outages</label>
              <div class="setting-desc">Planned maintenance alerts.</div>
            </div>
            <label class="switch">
              <input type="checkbox" x-model="prefs.pushScheduled" @change="savePrefs()" />
              <span class="slider round"></span>
            </label>
          </div>
          <div class="setting-row">
            <div>
              <label>Unscheduled Outages</label>
              <div class="setting-desc">Unexpected blackout alerts.</div>
            </div>
            <label class="switch">
              <input type="checkbox" x-model="prefs.pushUnscheduled" @change="savePrefs()" />
              <span class="slider round"></span>
            </label>
          </div>
          <button
            @click="requestPushPermission()"
            class="submit-button"
            style="margin-top: 10px; font-size: 0.8rem; padding: 8px"
          >
            Enable Browser Pushes
          </button>
        </div>
      </div>
    </div>
  </template>

  <style>
    #notification-modal-overlay {
      display: none;
    }
    #notification-modal-overlay.active {
      display: flex;
    }
    #notifications-container {
      padding-bottom: 80px;
    }
    .notif-page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      background: #fff;
      border-bottom: 1px solid #eee;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .notif-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .text-btn {
      background: none;
      border: none;
      color: #007bff;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .icon-btn {
      background: none;
      border: none;
      color: #555;
      cursor: pointer;
      display: flex;
      align-items: center;
    }
    .settings-popover {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 320px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      z-index: 20000;
      border: 1px solid #eee;
      animation: popIn 0.2s ease-out;
    }
    @keyframes popIn {
      from {
        opacity: 0;
        transform: translate(-50%, -40%);
      }
      to {
        opacity: 1;
        transform: translate(-50%, -50%);
      }
    }
    .settings-header {
      background: #f8f9fa;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      color: #333;
      border-bottom: 1px solid #eee;
    }
    .settings-header button {
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
    }
    .settings-body {
      padding: 16px;
    }
    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      font-size: 0.9rem;
      color: #333;
    }
    .setting-desc {
      font-size: 0.75rem;
      color: #888;
      margin-top: 4px;
      max-width: 200px;
      line-height: 1.3;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
      flex-shrink: 0;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: 0.4s;
      border-radius: 34px;
    }
    .slider:before {
      position: absolute;
      content: '';
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.4s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #f1c40f;
    }
    input:checked + .slider:before {
      transform: translateX(20px);
    }
    .notification-card {
      display: flex;
      gap: 12px;
      padding: 16px;
      background: #fff;
      border-bottom: 1px solid #eee;
      cursor: pointer;
      position: relative;
      transition: background 0.2s;
    }
    .notification-card:hover {
      background: #f9f9f9;
    }
    .notification-card.unread {
      background: #fffdf0;
    }
    .notification-card.urgent {
      background: #fff5f5;
      border-left: 4px solid #e74c3c;
    }
    .notification-icon {
      padding-top: 2px;
      color: #f1c40f;
    }
    .notification-card.urgent .notification-icon {
      color: #e74c3c;
    }
    .notification-card.read .notification-icon {
      color: #bdc3c7;
    }
    .notification-content {
      flex: 1;
    }
    .notification-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .notification-title {
      font-weight: 600;
      color: #333;
      font-size: 0.95rem;
    }
    .notification-card.read .notification-title {
      color: #7f8c8d;
      font-weight: 500;
    }
    .badge-urgent {
      background: #e74c3c;
      color: white;
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 700;
    }
    .notification-detail {
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 6px;
      line-height: 1.4;
    }
    .notification-time {
      font-size: 0.75rem;
      color: #999;
    }
    .unread-dot {
      width: 8px;
      height: 8px;
      background: #f1c40f;
      border-radius: 50%;
      position: absolute;
      top: 16px;
      right: 16px;
    }
    /* Modal style override */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal {
      background: white;
    }
  </style>
</main>
